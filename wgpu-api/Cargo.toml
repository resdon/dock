[package]
name = "wgpu-api"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1", features = ["extern_crate_alloc", "derive"] }
log = "0.4"
# Structured logging and performance tracing
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling: thiserror for typed errors, anyhow for propagation, miette for diagnostics
thiserror = "2"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }
once_cell = "1.21"
raw-window-handle = "0.6"
# GPU rendering backend — wgpu 30 with Vulkan support
wgpu = { version = "30", features = ["vulkan"] }
wgpu-dmabuf = "0.1"
# GPU profiling — optional, requires TIMESTAMP_QUERY wgpu feature
wgpu-profiler = { version = "0.16", optional = true }
# GPU text rendering — glyphon uses cosmic-text for shaping, etagere for atlas packing
glyphon = "0.12"
# Keep cosmic-text for direct text layout (glyphon re-exports it)
cosmic-text = "0.19"
fontdb = "0.16"
swash = "0.1.18"
# GIF decoding for animated images
gif = "0.13"
half = "2.7"
# Math library for vectors, matrices, and quaternions
glam = "0.29"
# Slint UI toolkit (optional, for wgpu-30 integration)
slint = { version = "1.18", features = ["unstable-wgpu-30"], optional = true }

[features]
slint-wgpu-30 = ["slint"]
profiler = ["dep:wgpu-profiler"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Benchmarking framework for physics, text layout, and image processing
criterion = { version = "0.5", features = ["html_reports"] }
