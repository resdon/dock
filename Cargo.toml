[package]
name = "dock"
version = "1.5.5"
edition = "2021"
default-run = "dock"

[lib]
name = "library"
path = "src/lib.rs"

[[bin]]
name = "test"
path = "src/services/test.rs"

[[bin]]
name = "monitor"
path = "src/services/monitor.rs"

[dependencies]
wgpu-api = { path = "wgpu-api" }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
smithay-client-toolkit = { version = "0.20.0" }

wayland-protocols-wlr = { version = "0.3", features = ["client"] }

sysinfo = "0.40"

# Add this for your static caching maps:

# Add your image lookup dependencies from your proof-of-concept scripts:
linicon = "2.3"
image = "0.25.10"
base64 = "0.22" # Required to encode the binary image bytes over the terminal stream
walkdir = "2.5.0"
resvg = "0.47.0"
# FIX (v1.5.5): Replaced fontdue with swash to eliminate ~23 MB retained font geometry
swash = "0.1.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
dirs = "6.0.0"

memmap2 = "0.9"
libc = "0.2"
urlencoding = "2.1.3"
os_pipe = "1.2.3"

zbus = { version = "6", features = ["tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"

# wgpu GPU rendering (via wgpu-api crate)
wgpu = { version = "30", features = ["vulkan"] }
wgpu-dmabuf = "0.1"
imgref = "1.10"
rgb = "0.8"

# SIMD-optimized image resizing (replaces custom Lanczos-3)
fast_image_resize = { version = "5.0", features = ["image"] }

# PipeWire for window capture (list-widget integration)
pipewire = "0.10.1"

# Concurrent and bounded caching
dashmap = "6.1"
lru = "0.12"

# Timeout-based Mutex to prevent PipeWire stream threads from freezing the dock
parking_lot = "0.12"

# Lock-free structures, channels, and thread coordination
crossbeam = "0.8"


# Error handling: thiserror for typed errors, anyhow for propagation, miette for diagnostics
thiserror = "2"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }
# Structured logging and performance tracing (root crate)
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Development error reporting with backtraces
color-eyre = "0.6"

# Profiling toolkit — all optional, zero overhead in release builds without feature flags
tracy-client = { version = "0.16", optional = true, default-features = false, features = ["enable"] }
dhat = { version = "0.3", optional = true }

[features]
tracy = ["dep:tracy-client"]
dhat-heap = ["dep:dhat"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false


