[package]
name = "dock"
version = "1.5.0"
edition = "2021"
default-run = "dock"

[lib]
name = "library"
path = "src/lib.rs"

[[bin]]
name = "test"
path = "src/services/test.rs"

[[bin]]
name = "monitor"
path = "src/services/monitor.rs"

[dependencies]
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
smithay-client-toolkit = { version = "0.20.0" }

wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

sysinfo = "0.33"

# Add this for your static caching maps:
lazy_static = "1.5.0"

# Add your image lookup dependencies from your proof-of-concept scripts:
linicon = "2.3"
image = "0.25"
base64 = "0.22" # Required to encode the binary image bytes over the terminal stream
sixel-rs = "0.5.0"
icy_sixel = "0.5.0"
walkdir = "2.5.0"
resvg = "0.47.0"
fontdue = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21.4"
dirs = "6.0.0"

memmap2 = "0.9"
libc = "0.2.189"
urlencoding = "2.1.3"
os_pipe = "1.2.3"

zbus = { version = "4.0", features = ["tokio"] }
zvariant = "4.0"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
cairo-rs = "0.19"
usvg = "0.48.1"
tiny-skia = "0.12.0"

# FemtoVG + wgpu GPU rendering
femtovg = { version = "0.28", features = ["wgpu", "image-loading", "textlayout"] }
wgpu = { version = "30", features = ["vulkan"] }
wgpu-dmabuf = "0.1"
imgref = "1.10"
rgb = "0.8"

# SIMD-optimized image resizing (replaces custom Lanczos-3)
fast_image_resize = { version = "5.0", features = ["image"] }

# Slint for dock icon rendering (software renderer - direct buffer rendering)
slint = { version = "1.18", features = ["renderer-software"] }

# PipeWire for window capture (list-widget integration)
pipewire = "0.10"
pipewire-sys = "0.10"
libspa-sys = "0.10"

# Concurrent and bounded caching
dashmap = "6.1"
lru = "0.12"

[build-dependencies]
slint-build = { version = "1.18" }


