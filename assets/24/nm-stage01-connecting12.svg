use super::AppState;
use wayland_client::backend::ObjectId;

/// Strips trailing numeric instance identifiers (e.g., "app_1234" -> "app") while leaving Steam app IDs untouched.
fn normalize_app_id(app_id: &str) -> &str {
    if app_id.starts_with("steam_icon_") {
        return app_id;
    }
    if let Some(idx) = app_id.rfind('_') {
        if app_id[idx + 1..].chars().all(|c| c.is_numeric()) {
            return &app_id[..idx];
        }
    }
    app_id
}

impl AppState {
    pub fn set_popup_input_region(
        &self,
        surface: &wayland_client::protocol::wl_surface::WlSurface,
        width: i32,
        height: i32,
        scale_factor: f32,
    ) {
        // Call create_region on the underlying wl_compositor() using self.qh
        let region = self
            .compositor_state
            .wl_compositor()
            .create_region(&self.qh, ());

        let logical_w = (width as f32 / scale_factor).round().max(1.0) as i32;
        let logical_h = (height as f32 / scale_factor).round().max(1.0) as i32;

        region.add(0, 0, logical_w, logical_h);
        surface.set_input_region(Some(&region));
        region.destroy();
    }
    /// Returns true if at least one window, pinned app, or background icon search is active
    pub fn is_animating(&self) -> bool {
        let windows_loading = self
            .windows
            .values()
            .any(|win| !win.icon_resolved && win.icon_rgba.is_none());

        let pinned_loading = self
            .pinned_apps
            .iter()
            .any(|app_id| !self.icon_cache.contains_key(app_id));

        let searches_pending = !self.pending_icon_searches.is_empty();

        windows_loading || pinned_loading || searches_pending
    }

    pub fn close_application_completely(&mut self, app_id: &str) {
        let mut pids_to_kill = Vec::new();
        let target_app_lower = app_id.to_lowercase();

        for win in self.windows.values() {
            let win_app_id = win.app_id.as_ref()
                .map(|id| id.to_string())
                .filter(|id| !id.is_empty())
                .unwrap_or_else(|| win.title.clone())
                .to_lowercase();

            if win_app_id == target_app_lower
                || win_app_id.starts_with(&target_app_lower)
                || target_app_lower.contains(&win_app_id)
            {
                if let Some(handle) = self.window_handle(&win.id.0) {
                    handle.close();
                }
                if let Some(pid) = win.process_id {
                    pids_to_kill.push(pid.0);
                }
            }
        }

        if target_app_lower.contains("steam") || app_id.starts_with("steam_icon_") {
            let _ = std::process::Command::new("steam").arg("-shutdown").spawn();
        }

        // Safely terminate window-associated PIDs
        for pid in &pids_to_kill {
            if *pid > 1 {
                unsafe {
                    libc::kill(*pid as i32, libc::SIGTERM);
                }
            }
        }

        self.sys_scanner
            .refresh_processes(sysinfo::ProcessesToUpdate::All, true);
        let clean_name = normalize_app_id(&target_app_lower);

        // Strict process name match to avoid accidental terminations of short-named binaries
        for (pid, proc_) in self.sys_scanner.processes() {
            let pid_u32 = pid.as_u32();
            if pid_u32 <= 1 {
                continue;
            }

            let proc_name = proc_.name().to_string_lossy().to_lowercase();
            let proc_stem = proc_name.split('.').next().unwrap_or(&proc_name);

            if proc_name == clean_name || proc_stem == clean_name {
                unsafe {
                    libc::kill(pid_u32 as i32, libc::SIGTERM);
                }
            }
        }

        self.needs_redraw = true;
    }

    pub fn cycle_window_for_app(&mut self, target_app_id: &str, reverse: bool) {
        let mut matching_windows: Vec<&crate::state::WindowState> = self
            .windows
            .values()
            .filter(|win| {
                win.app_id.as_ref().map(|id| id.as_str()) == Some(target_app_id)
                    || win.title == target_app_id
            })
            .collect();

        if matching_windows.len() <= 1 {
            return;
        }

        matching_windows.sort_by_key(|win| win.order_index);

        let active_idx = matching_windows.iter().position(|win| win.focused);
        let count = matching_windows.len();
        let next_idx = match active_idx {
            Some(idx) if reverse => (idx + count - 1) % count,
            Some(idx) => (idx + 1) % count,
            None => 0,
        };

        let target_id = matching_windows[next_idx].id.0.clone();
        if let Some(seat) = &self.wl_seat {
            if let Some(handle) = self.window_handle(&target_id) {
                handle.activate(seat);
                self.needs_redraw = true;
            }
        }
    }

    pub fn update_window_icon(&mut self, window_id: ObjectId) {
        let Some(window_id) = self.window_id_for_object(&window_id) else { return; };
        let Some(app_id) = self.windows.get(&window_id).and_then(|w| {
            w.app_id.as_ref().map(|id| id.to_string()).filter(|s| !s.is_empty())
                .or_else(|| if !w.title.is_empty() { Some(w.title.clone()) } else { None })
        }) else { return; };

        if let Some((rgba, size)) = self.icon_cache.get(&app_id).cloned() {
            if let Some(window) = self.windows.get_mut(&window_id) {
                window.icon_rgba = Some(rgba);
                window.icon_size = size;
                window.icon_name = app_id;
                window.icon_resolved = true;
            }
        } else {
            self.request_icon_load(app_id);
        }
    }

    pub fn update_window_list(&mut self, active_app_ids: &[String]) {
        let mut state_changed = false;

        // Clear hover popup if the hovered app is no longer running
        if let Some(ref hovered_id) = self.hover_state.app_id {
            if !active_app_ids.contains(hovered_id) {
                self.hover_state.is_visible = false;
                self.hover_state.app_id = None;
                state_changed = true;
            }
        }

        // Only set needs_redraw if a state change occurred AND dock is visible/interactive
        if state_changed && (self.interaction.pointer_inside) {
            self.needs_redraw = true;
        }
    }
}
